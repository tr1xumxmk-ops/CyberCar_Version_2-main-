<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#080b10"/><stop offset="1" stop-color="#15100c"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1600" height="1000" fill="url(#bg)"/><g stroke="#3b2d10" stroke-width="1" opacity=".7"><path d="M30 0V1000"/><path d="M70 0V1000"/><path d="M110 0V1000"/><path d="M150 0V1000"/><path d="M190 0V1000"/><path d="M230 0V1000"/><path d="M270 0V1000"/><path d="M310 0V1000"/><path d="M350 0V1000"/><path d="M390 0V1000"/><path d="M430 0V1000"/><path d="M470 0V1000"/><path d="M510 0V1000"/><path d="M550 0V1000"/><path d="M590 0V1000"/><path d="M630 0V1000"/><path d="M670 0V1000"/><path d="M710 0V1000"/><path d="M750 0V1000"/><path d="M790 0V1000"/><path d="M830 0V1000"/><path d="M870 0V1000"/><path d="M910 0V1000"/><path d="M950 0V1000"/><path d="M990 0V1000"/><path d="M1030 0V1000"/><path d="M1070 0V1000"/><path d="M1110 0V1000"/><path d="M1150 0V1000"/><path d="M1190 0V1000"/><path d="M1230 0V1000"/><path d="M1270 0V1000"/><path d="M1310 0V1000"/><path d="M1350 0V1000"/><path d="M1390 0V1000"/><path d="M1430 0V1000"/><path d="M1470 0V1000"/><path d="M1510 0V1000"/><path d="M1550 0V1000"/><path d="M1590 0V1000"/><path d="M0 30H1600"/><path d="M0 70H1600"/><path d="M0 110H1600"/><path d="M0 150H1600"/><path d="M0 190H1600"/><path d="M0 230H1600"/><path d="M0 270H1600"/><path d="M0 310H1600"/><path d="M0 350H1600"/><path d="M0 390H1600"/><path d="M0 430H1600"/><path d="M0 470H1600"/><path d="M0 510H1600"/><path d="M0 550H1600"/><path d="M0 590H1600"/><path d="M0 630H1600"/><path d="M0 670H1600"/><path d="M0 710H1600"/><path d="M0 750H1600"/><path d="M0 790H1600"/><path d="M0 830H1600"/><path d="M0 870H1600"/><path d="M0 910H1600"/><path d="M0 950H1600"/><path d="M0 990H1600"/></g><text x="60" y="66" fill="#ffd400" font-family="Arial" font-size="30" font-weight="bold">SPARK REDLINE — REV A CARRIER / SYSTEM CONNECTIONS</text><text x="60" y="98" fill="#f04444" font-family="Arial" font-size="16">Low-current logic carrier · motor-current routing excluded · generic future peripheral support</text><rect x="50" y="150" width="320" height="155" rx="12" fill="#0b1018" stroke="#f04444" stroke-width="2.5"/><text x="68" y="182" fill="#f04444" font-family="Arial" font-size="20" font-weight="bold">2S LiPo battery</text><text x="68" y="212" fill="#e8edf4" font-family="Arial" font-size="15">Branch A → L298N motor power directly</text><text x="68" y="237" fill="#e8edf4" font-family="Arial" font-size="15">Branch B → buck converter IN+/IN−</text><text x="68" y="262" fill="#e8edf4" font-family="Arial" font-size="15">Use a switch and suitable fuse/wiring</text><rect x="450" y="150" width="300" height="155" rx="12" fill="#0b1018" stroke="#ffd400" stroke-width="2.5"/><text x="468" y="182" fill="#ffd400" font-family="Arial" font-size="20" font-weight="bold">5V buck converter</text><text x="468" y="212" fill="#e8edf4" font-family="Arial" font-size="15">Input: battery voltage range approved</text><text x="468" y="237" fill="#e8edf4" font-family="Arial" font-size="15">Output: set and meter to 5.00 V</text><text x="468" y="262" fill="#e8edf4" font-family="Arial" font-size="15">Output feeds carrier J1 (+5V/GND)</text><rect x="850" y="145" width="330" height="190" rx="12" fill="#0b1018" stroke="#ffd400" stroke-width="2.5"/><text x="868" y="177" fill="#ffd400" font-family="Arial" font-size="20" font-weight="bold">LOLIN S2 Mini / ESP32-S2</text><text x="868" y="207" fill="#e8edf4" font-family="Arial" font-size="15">Separate module; connect to J2 harness</text><text x="868" y="232" fill="#e8edf4" font-family="Arial" font-size="15">GPIO7/6/4/5 → IN1/IN2/IN3/IN4</text><text x="868" y="257" fill="#e8edf4" font-family="Arial" font-size="15">GPIO11/12 → ENA/ENB</text><text x="868" y="282" fill="#e8edf4" font-family="Arial" font-size="15">GPIO13 → servo; GPIO18 → buzzer</text><text x="868" y="307" fill="#e8edf4" font-family="Arial" font-size="15">GPIO8/9/3 → R/G/B status LEDs</text><rect x="1250" y="150" width="300" height="165" rx="12" fill="#0b1018" stroke="#f04444" stroke-width="2.5"/><text x="1268" y="182" fill="#f04444" font-family="Arial" font-size="20" font-weight="bold">L298N module</text><text x="1268" y="212" fill="#e8edf4" font-family="Arial" font-size="15">J3: GND, IN1, IN2, IN3, IN4, ENA, ENB</text><text x="1268" y="237" fill="#e8edf4" font-family="Arial" font-size="15">Motor outputs stay on L298N</text><text x="1268" y="262" fill="#e8edf4" font-family="Arial" font-size="15">Battery motor supply wired directly</text><text x="1268" y="287" fill="#e8edf4" font-family="Arial" font-size="15">Never route motor current through carrier</text><rect x="50" y="420" width="300" height="160" rx="12" fill="#0b1018" stroke="#ffd400" stroke-width="2.5"/><text x="68" y="452" fill="#ffd400" font-family="Arial" font-size="20" font-weight="bold">J1: CARRIER POWER</text><text x="68" y="482" fill="#e8edf4" font-family="Arial" font-size="15">Pin 1: regulated +5V</text><text x="68" y="507" fill="#e8edf4" font-family="Arial" font-size="15">Pin 2: GND</text><text x="68" y="532" fill="#e8edf4" font-family="Arial" font-size="15">No raw battery input on J1</text><rect x="450" y="420" width="300" height="160" rx="12" fill="#0b1018" stroke="#ffd400" stroke-width="2.5"/><text x="468" y="452" fill="#ffd400" font-family="Arial" font-size="20" font-weight="bold">J2: ESP32 HARNESS</text><text x="468" y="482" fill="#e8edf4" font-family="Arial" font-size="15">1×16 header, 2.54 mm pitch</text><text x="468" y="507" fill="#e8edf4" font-family="Arial" font-size="15">Pin map in CONNECTOR_PINOUT.csv</text><text x="468" y="532" fill="#e8edf4" font-family="Arial" font-size="15">Use labeled, short jumper leads</text><rect x="850" y="420" width="300" height="160" rx="12" fill="#0b1018" stroke="#f04444" stroke-width="2.5"/><text x="868" y="452" fill="#f04444" font-family="Arial" font-size="20" font-weight="bold">J3: MOTOR CONTROL</text><text x="868" y="482" fill="#e8edf4" font-family="Arial" font-size="15">1×7 terminal, 5.08 mm pitch</text><text x="868" y="507" fill="#e8edf4" font-family="Arial" font-size="15">Logic signals only; shared GND</text><text x="868" y="532" fill="#e8edf4" font-family="Arial" font-size="15">Remove ENA/ENB module jumpers</text><rect x="1250" y="420" width="300" height="160" rx="12" fill="#0b1018" stroke="#ffd400" stroke-width="2.5"/><text x="1268" y="452" fill="#ffd400" font-family="Arial" font-size="20" font-weight="bold">J4 / J5 / J6</text><text x="1268" y="482" fill="#e8edf4" font-family="Arial" font-size="15">J4: GND, +5V, servo signal</text><text x="1268" y="507" fill="#e8edf4" font-family="Arial" font-size="15">J5: 3V3, GND, GPIO1, GPIO2</text><text x="1268" y="532" fill="#e8edf4" font-family="Arial" font-size="15">J6: +5V and switched piezo buzzer</text><path d="M370 225 L450 225" stroke="#f04444" stroke-width="4" fill="none"/><path d="M440 218 L450 225 L440 232" stroke="#f04444" stroke-width="3" fill="none"/><path d="M750 225 L850 225" stroke="#ffd400" stroke-width="4" fill="none"/><path d="M840 218 L850 225 L840 232" stroke="#ffd400" stroke-width="3" fill="none"/><path d="M1180 225 L1250 225" stroke="#f04444" stroke-width="4" fill="none"/><path d="M1240 218 L1250 225 L1240 232" stroke="#f04444" stroke-width="3" fill="none"/><path d="M210 305 L210 420" stroke="#f04444" stroke-width="4" fill="none"/><path d="M600 305 L600 420" stroke="#ffd400" stroke-width="4" fill="none"/><path d="M1015 335 L1015 420" stroke="#ffd400" stroke-width="4" fill="none"/><path d="M1400 315 L1400 420" stroke="#f04444" stroke-width="4" fill="none"/><rect x="50" y="680" width="710" height="225" rx="12" fill="#0b1018" stroke="#f04444" stroke-width="2.5"/><text x="68" y="712" fill="#f04444" font-family="Arial" font-size="20" font-weight="bold">POWER AND SAFETY NOTES</text><text x="68" y="742" fill="#e8edf4" font-family="Arial" font-size="15">• Motor battery +/− must go directly to the L298N motor-supply terminals.</text><text x="68" y="767" fill="#e8edf4" font-family="Arial" font-size="15">• Buck output must be measured at 5.00 V before it reaches J1.</text><text x="68" y="792" fill="#e8edf4" font-family="Arial" font-size="15">• Logic GND on J2/J3/J4/J5/J6 is common; all modules need common ground.</text><text x="68" y="817" fill="#e8edf4" font-family="Arial" font-size="15">• Do not connect the carrier +5V to the L298N module 5V terminal.</text><text x="68" y="842" fill="#e8edf4" font-family="Arial" font-size="15">• Do not power from USB and carrier 5V simultaneously unless board isolation is verified.</text><text x="68" y="867" fill="#e8edf4" font-family="Arial" font-size="15">• Servo current can brown out the MCU; buck must meet peak current.</text><rect x="820" y="680" width="730" height="225" rx="12" fill="#0b1018" stroke="#ffd400" stroke-width="2.5"/><text x="838" y="712" fill="#ffd400" font-family="Arial" font-size="20" font-weight="bold">WHAT THIS BOARD IS / IS NOT</text><text x="838" y="742" fill="#e8edf4" font-family="Arial" font-size="15">• Two-layer low-current controller carrier, not an integrated motor driver.</text><text x="838" y="767" fill="#e8edf4" font-family="Arial" font-size="15">• Existing ESP32-S2 and L298N remain separate modules connected by harnesses.</text><text x="838" y="792" fill="#e8edf4" font-family="Arial" font-size="15">• On-board RGB LEDs, low-side NPN buzzer stage, servo connector and decoupling.</text><text x="838" y="817" fill="#e8edf4" font-family="Arial" font-size="15">• J5 is generic future expansion; use 3.3V-safe modules only.</text><text x="838" y="842" fill="#e8edf4" font-family="Arial" font-size="15">• Review the KiCad board, refill zone, run DRC and verify transistor/servo pinouts</text><text x="838" y="867" fill="#e8edf4" font-family="Arial" font-size="15">  before manufacturing. This Rev-A file is an engineering prototype.</text><text x="60" y="955" fill="#9aa5b2" font-family="Arial" font-size="14">SPARK TEAM · Haider Nather · Ahmed Amjed · Ayat Sayed · Baraa Fadhel  |  Diagram is explanatory, not to scale.</text></svg>